[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
  ".venv",
  "venv",
  "alembic",
  "migrations",
  "seed",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes: undefined names, unused imports
  "I",   # import sorting
  "B",   # bugbear: risky bug patterns
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line length handled by formatter / line-length
  "B008", # FastAPI Depends/Query false positives
  "UP042", # keep str + Enum for existing API/SQLAlchemy enum behavior
  "UP046", # keep Generic[T]: PEP 695 type params are invalid inside ClassVar (BaseRepository.model) and risky with Pydantic generics
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vulture]
paths = ["app", "tests", "alembic"]
exclude = [".venv", "venv", "migrations", "seed"]
ignore_decorators = ["@app.*", "@router.*"]
min_confidence = 90
sort_by_size = true
