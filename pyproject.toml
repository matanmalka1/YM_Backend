[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "venv",
  "alembic",
  "migrations",
  "seed",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes: undefined names, unused imports
  "I",   # import sorting
  "B",   # bugbear: risky bug patterns
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line length handled by formatter / line-length
  "B008", # FastAPI Depends/Query false positives
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
[tool.vulture]
paths = ["app", "tests", "alembic"]
exclude = [".venv", "venv", "migrations", "seed"]
ignore_decorators = ["@app.*", "@router.*"]
min_confidence = 80
sort_by_size = true
