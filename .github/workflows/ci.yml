name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

# Run-but-don't-block: report results, but do not enforce as required
# status checks yet. To turn into a hard gate later, add these jobs as
# required checks in GitHub branch protection for `main`.

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Enforces the cross-domain import rules in docs/backend/architecture.md.
      # Pure-stdlib AST scan, so it needs no project dependencies.
      - name: Domain boundary check
        run: python scripts/audit/check_domain_boundaries.py --fail-on-findings

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: binder_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d binder_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-only
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/binder_crm_test
        run: |
          alembic upgrade head
          pytest --cov=app --cov-report=term-missing

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest

    # Pin 17 to match Neon production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: binder_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Single migration head (no divergence)
        # No DB needed for this check; APP_ENV=test keeps the localhost
        # guard in app/config.py from firing.
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-only
        run: |
          heads=$(alembic heads | grep -c '(head)') || true
          echo "head count: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "ERROR: expected exactly 1 alembic head, found $heads."
            echo "Migration branches have diverged — merge them with 'alembic merge'."
            alembic heads
            exit 1
          fi

      - name: Migrations apply cleanly (Postgres)
        # Roundtrip also validates that downgrade() functions are correct.
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-only
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/binder_crm
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations (alembic check)
        # After upgrade head the DB reflects all migrations. `alembic check`
        # autogenerates against the live SQLAlchemy metadata and fails if a
        # model was changed without a matching migration. env.py sets
        # compare_type and compare_server_default, so column-type and
        # server-default changes are caught too.
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-only
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/binder_crm
        run: alembic check

  openapi-sync:
    name: OpenAPI in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Committed openapi.json matches the app
        # The frontend api-drift check pulls from the committed openapi.json.
        # If a schema changes but openapi.json is not regenerated, drift would
        # slip past both repos. This closes that loophole. No DB needed.
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-only
        run: python -m scripts.tooling.check_contract_sync

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pyright
        # Config lives in pyproject.toml [tool.pyright] so CI and local agree.
        # Its venvPath points at .venv, which does not exist here — pyright logs
        # a harmless "subdirectory not found" note and --pythonpath points it at
        # the CI interpreter instead. That config disables most report* checks,
        # so this is a lenient gate (undefined names, bad imports, syntax)
        # rather than strict typing.
        run: pyright --pythonpath "$(which python)"
